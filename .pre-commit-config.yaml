repos:
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.3
    hooks:
      - id: oca-checks-odoo-module

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        verbose: true
        args:
          - --color
          - --fix
        additional_dependencies:
          - eslint@9.15.0
          - globals@15.12.0
