services:
  web:
    build: .
    shm_size: "1g"
    depends_on:
      - db
    ports:
      - "8069:8069"
    command: ["odoo", "--dev=all"]
    volumes:
      - odoo-web-data:/var/lib/odoo
      - .:/mnt/extra-addons
      - ./odoo_tests_output:/tmp/odoo_tests/test
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

volumes:
  odoo-web-data:
  odoo-db-data:
