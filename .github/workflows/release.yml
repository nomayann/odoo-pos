name: Release Odoo Module

on:
  workflow_run:
    workflows: ["Odoo Module CI"]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Module Name and Version from Tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          MODULE_NAME=$(echo "$TAG" | sed -E 's/-v[0-9]+.*//')
          VERSION=$(echo "$TAG" | sed -E 's/.*-v//')

          echo "module_name=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Module détecté : $MODULE_NAME"
          echo "Version détectée : $VERSION"

      - name: Verify module exists
        run: |
          MODULE="${{ steps.extract.outputs.module_name }}"
          if [ ! -d "$MODULE" ]; then
            echo "Erreur : Le dossier du module '$MODULE' n'existe pas à la racine du dépôt."
            exit 1
          fi
          if [ ! -f "$MODULE/__manifest__.py" ]; then
            echo "Erreur : Le dossier '$MODULE' ne contient pas de fichier __manifest__.py."
            exit 1
          fi

      - name: Build Module ZIP
        run: |
          MODULE="${{ steps.extract.outputs.module_name }}"
          ZIP_NAME="${{ steps.extract.outputs.module_name }}-${{ steps.extract.outputs.version }}.zip"

          echo "Création du zip propre pour $MODULE..."
          zip -r "$ZIP_NAME" "$MODULE" \
            -x "*/.git*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "*.DS_Store" \
            -x "*/tests/*" \
            -x "*/.editorconfig" \
            -x "*/.gitignore" \
            -x "*/.github/*" \
            -x "*/.vscode/*"

          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.zip_name }}
          name: "${{ steps.extract.outputs.module_name }} v${{ steps.extract.outputs.version }}"
          body: |
            Automated release for Odoo 18 module: **${{ steps.extract.outputs.module_name }}**
            Version: `v${{ steps.extract.outputs.version }}`
          draft: false
          prerelease: false
