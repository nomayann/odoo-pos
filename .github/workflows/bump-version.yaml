name: Auto-Create Version Bump PRs

on:
  push:
    branches:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare HEAD~1 and HEAD
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect Code Changes, Bump Version and Open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > bump_script.py
          import os, subprocess, re

          def increment_version(version_str):
              parts = version_str.split(".")
              try:
                  parts[-1] = str(int(parts[-1]) + 1)
                  return ".".join(parts)
              except ValueError:
                  return version_str

          # 1. Retrieve all modified files in the latest commit on main
          result = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True, check=True)
          changed_files = result.stdout.splitlines()

          # 2. Group modified files by module
          module_files = {}
          for file in changed_files:
              parts = file.split("/")
              # Ensure it is a top-level directory (the module folder)
              if len(parts) > 1 and os.path.isdir(parts[0]):
                  module_name = parts[0]
                  module_files.setdefault(module_name, []).append(file)

          modules_to_bump = set()

          # 3. Filter: keep only modules where code (outside __manifest__.py) has changed
          for module, files in module_files.items():
              manifest_path = os.path.join(module, "__manifest__.py")
              if not os.path.exists(manifest_path):
                  continue

              # Identify if there are changes outside the manifest
              non_manifest_changes = [f for f in files if not f.endswith("__manifest__.py")]

              if non_manifest_changes:
                  print(f"✅ Module {module}: code changed ({non_manifest_changes}), version bump required.")
                  modules_to_bump.add(module)
              else:
                  print(f"⏩ Module {module} skipped: only __manifest__.py changed (prevents infinite loop).")

          # 4. Process each selected module
          for module in modules_to_bump:
              manifest_path = os.path.join(module, "__manifest__.py")

              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()

              match = re.search(r"[\"'\']version[\"'\']\s*:\s*[\"'\']([0-9.]+)[\"'\']", content)
              if not match:
                  print(f"⚠️ Version not found in {manifest_path}")
                  continue

              old_version = match.group(1)
              new_version = increment_version(old_version)
              branch_name = f"release/{module}-v{new_version}"

              print(f"Processing {module}: {old_version} -> {new_version} (Branch: {branch_name})")

              # Create and switch to a new branch
              subprocess.run(["git", "checkout", "-b", branch_name], check=True)

              # Update the manifest version safely
              new_content = (
                  content[: match.start(1)] + new_version + content[match.end(1) :]
              )

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(new_content)

              # Commit and push the branch
              subprocess.run(["git", "add", manifest_path], check=True)
              subprocess.run(["git", "commit", "-m", f"chore(release): bump {module} version to {new_version} [skip ci]"], check=True)
              subprocess.run(["git", "push", "origin", branch_name], check=True)

              # Open the Pull Request via GitHub CLI (gh)
              pr_title = f"chore(release): bump {module} version to {new_version}"
              pr_body = f"Automated version bump for module **{module}** from `{old_version}` to `{new_version}` following recent code changes."

              pr_result = subprocess.run([
                  "gh", "pr", "create",
                  "--base", "main",
                  "--head", branch_name,
                  "--title", pr_title,
                  "--body", pr_body
              ], capture_output=True, text=True)

              if pr_result.returncode == 0:
                  print(f"✅ PR successfully created for {module}: {pr_result.stdout.strip()}")
              else:
                  print(f"❌ Error creating PR for {module}: {pr_result.stderr}")

              # Switch back to main for the next module (if any)
              subprocess.run(["git", "checkout", "main"], check=True)
          EOF

          python3 bump_script.py
