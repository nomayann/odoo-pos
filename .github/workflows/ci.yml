name: Odoo Module CI

on:
  push:
    tags-ignore:
      - '*-v*' # Ignore les tags pour laisser le workflow de release gérer ses propres événements
  pull_request:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for non-breaking spaces
        run: |
          if git grep -n $'\xc2\xa0' -- '*.py' '*.xml' '*.js' '*.yml' '*.yaml' '*.json'; then
            echo "❌ Non-breaking spaces (\u00a0) detected! Replace them with standard spaces."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Discover and Validate all __manifest__.py
        run: |
          echo "Recherche et validation de tous les manifestes dans le monorepo..."
          python -c "
          import ast, sys, os

          errors = 0
          for root, dirs, files in os.walk('.'):
              if '__manifest__.py' in files:
                  manifest_path = os.path.join(root, '__manifest__.py')
                  print(f'Vérification de : {manifest_path}')
                  try:
                      with open(manifest_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      data = ast.literal_eval(content)
                      if not isinstance(data, dict):
                          print(f'❌ Erreur : {manifest_path} n\'est pas un dictionnaire valide.')
                          errors += 1
                      else:
                          print(f'✅ Manifeste valide : {root}')
                  except Exception as e:
                      print(f'❌ Erreur de syntaxe dans {manifest_path} : {e}')
                      errors += 1

          if errors > 0:
              print(f'\nTotal des erreurs de manifestes détectées : {errors}')
              sys.exit(1)
          else:
              print('\nTous les manifestes sont valides !')
          "

      - name: Run Python Linting (Flake8) across modules
        run: |
          echo "Lancement de Flake8 sur le code Python..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.*,venv,env
